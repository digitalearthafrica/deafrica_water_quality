name: Build and Push Image

env:
  IMAGE_NAME: deafrica-water-quality
  BRANCH_NAME: develop

on:
  workflow_dispatch:

jobs:
  push-if-main:
    if:  ${{ github.ref == 'refs/heads/${{ env.BRANCH_NAME }}' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DEAFRICA_DOCKER_USERNAME }}
          password: ${{ secrets.DEAFRICA_DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DEAFRICA_DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/${{ env.BRANCH_NAME }}' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: BUILD_ENV=prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
